name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate presentation map
        run: |
          git fetch origin public || true
          if git cat-file -e origin/public:map.json 2>/dev/null; then
            git show origin/public:map.json > /tmp/previous-map.json
          else
            printf '{}\n' > /tmp/previous-map.json
          fi
          python .github/tools/generate_map.py \
            --source powerpoints \
            --previous-map /tmp/previous-map.json \
            --output .github/docs/map.json
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci --prefix .github/viewer
      - name: Test viewer
        run: npm test --prefix .github/viewer
      - name: Set Pages base path
        run: |
          sed -i "s#base: '/pptx-web/'#base: '/viewer/'#" .github/viewer/vite.config.js
      - name: Apply viewer overrides
        run: |
          cat .github/viewer-overrides.css >> .github/viewer/src/styles.css
          cat .github/viewer-overrides.js >> .github/viewer/src/main.js
      - name: Build viewer
        run: npm run build --prefix .github/viewer -- --base=/viewer/
      - name: Add viewer to Pages artifact
        run: |
          rm -rf .github/docs/viewer
          mkdir -p .github/docs/viewer
          cp -R .github/viewer/dist/. .github/docs/viewer/
      - name: Configure custom domain
        run: echo "pptx.iktim.no" > .github/docs/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .github/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
