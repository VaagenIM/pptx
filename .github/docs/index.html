<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and download the public PowerPoint files in the VaagenIM/pptx repository.">
  <title>Public PowerPoints</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --panel: #fff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-contrast: #fff;
      --code: #f0f3f6;
      --error: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --code: #21262d;
        --error: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { margin: 0 auto; max-width: 1100px; padding: 2rem 1rem 4rem; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.5rem); }
    a { color: var(--accent); }
    .subtitle { color: var(--muted); margin: .35rem 0 1.5rem; }
    .toolbar, .file-list, .details {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; padding: 1rem; }
    input, select, button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      padding: .55rem .7rem;
    }
    input { flex: 1 1 260px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .status { color: var(--muted); margin: 1rem 0 .75rem; }
    .error { color: var(--error); }
    .breadcrumbs { display: flex; flex-wrap: wrap; gap: .25rem; margin: 1rem 0; }
    .breadcrumbs button { border: 0; padding: .15rem .3rem; }
    .file-list { overflow: hidden; }
    .row {
      align-items: center;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: .75rem;
      grid-template-columns: minmax(0, 1fr) auto auto;
      padding: .8rem 1rem;
    }
    .row:last-child { border-bottom: 0; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .name button { border: 0; padding: 0; text-align: left; }
    .icon { display: inline-block; width: 1.5rem; }
    .meta { color: var(--muted); font-size: .9rem; }
    .details { margin-top: 1rem; padding: 1rem; }
    .shortcuts { align-items: center; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: flex-end; }
    .shortcuts > a, .shortcuts > button { align-items: center; display: inline-flex; min-height: 2.25rem; padding: .35rem .6rem; }
    .text-action { border: 0; color: var(--accent); padding: .2rem; text-decoration: underline; }
    dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); max-width: min(680px, calc(100% - 2rem)); padding: 1.25rem; width: 100%; }
    dialog::backdrop { backdrop-filter: blur(5px); background: rgb(0 0 0 / 35%); }
    dialog textarea { background: var(--code); border: 1px solid var(--border); border-radius: 6px; color: var(--text); display: block; font: .85rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; margin: .75rem 0; min-height: 7rem; padding: .6rem; resize: vertical; width: 100%; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; }
    code { background: var(--code); border-radius: 4px; padding: .15rem .3rem; }
    footer { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
    body.embed-mode main { max-width: 900px; padding: 1rem; }
    body.embed-mode h1, body.embed-mode .subtitle, body.embed-mode footer { display: none; }
    @media (max-width: 600px) {
      .row { grid-template-columns: minmax(0, 1fr) auto; }
      .row .meta { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Public PowerPoints</h1>
    <p class="subtitle">Browse every file in <a id="repo-link" href="https://github.com/VaagenIM/pptx">VaagenIM/pptx</a>.</p>
    <section class="toolbar" aria-label="File filters">
      <input id="search" type="search" placeholder="Search files and folders…" aria-label="Search files and folders">
      <select id="type" aria-label="Filter by file type">
        <option value="all">All file types</option>
        <option value="pptx">PowerPoint (.pptx)</option>
        <option value="ppt">PowerPoint (.ppt)</option>
        <option value="other">Other files</option>
      </select>
      <button id="refresh" class="primary" type="button">Refresh</button>
    </section>
    <div id="status" class="status" role="status">Loading repository files…</div>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
    <section id="files" class="file-list" aria-live="polite"></section>
    <section id="details" class="details" hidden></section>
    <dialog id="copy-modal" aria-labelledby="copy-modal-title">
      <h2 id="copy-modal-title">Copy file</h2>
      <p id="copy-modal-path" class="meta"></p>
      <label for="copy-preview">Embed code preview</label>
      <textarea id="copy-preview" readonly></textarea>
      <div class="modal-actions">
        <button id="copy-url" type="button">Copy URL</button>
        <button id="copy-embed-code" type="button">Copy embed code</button>
        <button id="close-copy-modal" type="button">Close</button>
      </div>
    </dialog>
    <footer>Files are read from GitHub’s public repository tree. Large files may be subject to GitHub’s download limits.
      Viewer powered by <a href="https://github.com/costinEEST/pptx-web" target="_blank" rel="noopener">pptx-web</a>.
    </footer>
  </main>
  <script>
    (() => {
      const owner = "VaagenIM";
      const repo = "pptx";
      const branch = "main";
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
      const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
      const githubBase = `https://github.com/${owner}/${repo}/blob/${branch}/`;
      const viewerBase = "https://pptx.iktim.no/viewer/";
      const rootPath = "powerpoints";
      const state = { entries: [], path: rootPath, query: "", type: "all" };
      const $ = (id) => document.getElementById(id);

      function viewerUrl(rawUrl) {
        const url = new URL(viewerBase);
        url.searchParams.set("url", rawUrl);
        url.searchParams.set("embed", "1");
        url.searchParams.set("sidebar", "0");
        return url.href;
      }

      function setStatus(message, error = false) {
        $("status").textContent = message;
        $("status").className = error ? "status error" : "status";
      }

      function fileType(path) {
        const extension = path.split(".").pop().toLowerCase();
        return extension === "pptx" || extension === "ppt" ? extension : "other";
      }

      function isPublicEntry(entry) {
        const path = entry.path.toLowerCase();
        const name = path.split("/").pop();
        const extension = name.includes(".") ? name.split(".").pop() : "";
        return path !== "docs" && path !== ".github" && path !== "viewer" &&
          name !== "readme.md" && name !== ".gitignore" && name !== ".gitmodules" &&
          extension !== "css" && extension !== "js" &&
          !path.startsWith("docs/") && !path.startsWith(".github/") && !path.startsWith("viewer/");
      }

      function visibleEntries() {
        const prefix = state.path ? `${state.path}/` : "";
        const query = state.query.trim().toLowerCase();
        if (query) {
          return state.entries
            .filter((entry) => entry.type === "blob" && entry.path.startsWith(`${rootPath}/`) && entry.path.toLowerCase().includes(query))
            .filter((entry) => state.type === "all" || fileType(entry.path) === state.type)
            .map((entry) => ({ path: entry.path, name: entry.path.slice(rootPath.length + 1), type: entry.type, size: entry.size }))
            .sort((a, b) => a.path.localeCompare(b.path));
        }
        const children = new Map();
        state.entries.forEach((entry) => {
          if (!entry.path.startsWith(prefix)) return;
          const remainder = entry.path.slice(prefix.length);
          if (!remainder) return;
          const [name] = remainder.split("/");
          const childPath = prefix + name;
          if (!children.has(childPath)) {
            children.set(childPath, {
              path: childPath,
              name,
              type: remainder.includes("/") ? "tree" : entry.type,
              size: remainder.includes("/") ? null : entry.size
            });
          }
        });
        return [...children.values()]
          .filter((entry) => entry.type === "tree" || state.type === "all" || fileType(entry.path) === state.type)
          .sort((a, b) => (a.type !== b.type ? (a.type === "tree" ? -1 : 1) : a.name.localeCompare(b.name)));
      }

      function formatSize(bytes) {
        if (bytes == null) return "Folder";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function renderBreadcrumbs() {
        const parts = state.path === rootPath ? [] : state.path.slice(rootPath.length + 1).split("/");
        $("breadcrumbs").innerHTML = "";
        [["PowerPoints", rootPath]].concat(parts.map((part, index) => [part, `${rootPath}/${parts.slice(0, index + 1).join("/")}`]))
          .forEach(([label, path], index, all) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.onclick = () => { state.path = path; render(); };
            $("breadcrumbs").append(button);
            if (index < all.length - 1) $("breadcrumbs").append(document.createTextNode(" / "));
          });
      }

      function copy(text, button) {
        if (!button.dataset.copyWidth) {
          button.dataset.copyWidth = `${button.getBoundingClientRect().width}px`;
          button.style.minWidth = button.dataset.copyWidth;
        }
        navigator.clipboard.writeText(text).then(() => {
          const original = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => { button.textContent = original; }, 1200);
        }).catch(() => setStatus("Unable to copy to the clipboard.", true));
      }

      function openCopyModal(entry) {
        const rawUrl = rawBase + entry.path.split("/").map(encodeURIComponent).join("/");
        const fileUrl = entry.type === "tree"
          ? githubBase + entry.path.split("/").map(encodeURIComponent).join("/")
          : rawUrl;
        const isPowerPoint = fileType(entry.path) === "pptx" || fileType(entry.path) === "ppt";
        const embedCode = isPowerPoint
          ? `<iframe class="pptx-embed" src="${viewerUrl(rawUrl)}" width="960" height="569" allow="fullscreen" allowfullscreen frameborder="0" title="${entry.name}"></iframe>`
          : "";
        $("copy-modal-path").textContent = entry.path;
        $("copy-preview").value = embedCode || fileUrl;
        $("copy-preview").previousElementSibling.textContent = embedCode ? "Embed code preview" : "URL preview";
        $("copy-url").onclick = () => copy(fileUrl, $("copy-url"));
        $("copy-embed-code").hidden = !isPowerPoint;
        $("copy-embed-code").onclick = () => copy(embedCode, $("copy-embed-code"));
        $("copy-modal").showModal();
      }

      function renderDetails(entry) {
        const rawUrl = rawBase + entry.path.split("/").map(encodeURIComponent).join("/");
        const githubUrl = githubBase + entry.path.split("/").map(encodeURIComponent).join("/");
        $("details").hidden = false;
        $("details").innerHTML = `<strong>${entry.path}</strong><p class="meta">${formatSize(entry.size)}</p>`;
        const copyPath = document.createElement("button");
        copyPath.textContent = "Copy path";
        copyPath.onclick = () => copy(entry.path, copyPath);
        const copyUrl = document.createElement("button");
        copyUrl.textContent = "Copy File URL";
        copyUrl.onclick = () => copy(rawUrl, copyUrl);
        const isPowerPoint = fileType(entry.path) === "pptx" || fileType(entry.path) === "ppt";
        let presentationUrl;
        if (isPowerPoint) {
          presentationUrl = viewerUrl(rawUrl);
          const copyEmbed = document.createElement("button");
          copyEmbed.textContent = "Copy embed code";
          copyEmbed.style.marginLeft = ".5rem";
          copyEmbed.onclick = () => copy(`<iframe class="pptx-embed" src="${presentationUrl}" width="960" height="569" allow="fullscreen" allowfullscreen frameborder="0" title="${entry.name}"></iframe>`, copyEmbed);
          $("details").append(copyEmbed);
        }
        const open = document.createElement("a");
        open.href = githubUrl;
        open.target = "_blank";
        open.rel = "noopener";
        open.textContent = "View on GitHub";
        open.style.marginLeft = ".5rem";
        $("details").append(copyPath, " ", copyUrl, " ", open);
        if (isPowerPoint) {
          const viewOnline = document.createElement("a");
          viewOnline.href = presentationUrl;
          viewOnline.target = "_blank";
          viewOnline.rel = "noopener";
          viewOnline.textContent = "View online";
          viewOnline.style.marginLeft = ".5rem";
          $("details").append(viewOnline);
        }
      }

      function render() {
        renderBreadcrumbs();
        const entries = visibleEntries();
        $("files").innerHTML = "";
        $("details").hidden = true;
        if (!entries.length) {
          $("files").textContent = "No matching files or folders.";
          return;
        }
        entries.forEach((entry) => {
          const row = document.createElement("div");
          row.className = "row";
          const name = document.createElement("div");
          name.className = "name";
          const button = document.createElement("button");
          button.type = "button";
          button.innerHTML = `<span class="icon">${entry.type === "tree" ? "📁" : "📄"}</span>${entry.name}`;
          button.onclick = () => entry.type === "tree" ? (state.path = entry.path, render()) : renderDetails(entry);
          name.append(button);
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = formatSize(entry.size);
          const shortcuts = document.createElement("div");
          shortcuts.className = "shortcuts";
          const copyPath = document.createElement("a");
          copyPath.href = "#";
          copyPath.textContent = "Copy";
          copyPath.className = "text-action";
          copyPath.onclick = (event) => { event.preventDefault(); openCopyModal(entry); };
          shortcuts.append(copyPath);
          if (entry.type !== "tree") {
            const rawUrl = rawBase + entry.path.split("/").map(encodeURIComponent).join("/");
            const action = document.createElement("a");
            action.href = rawUrl;
            action.download = entry.name;
            action.textContent = "Download";
            shortcuts.append(action);
            if (fileType(entry.path) === "pptx" || fileType(entry.path) === "ppt") {
              const viewOnline = document.createElement("a");
              viewOnline.href = viewerUrl(rawUrl);
              viewOnline.target = "_blank";
              viewOnline.rel = "noopener";
              viewOnline.textContent = "View online";
              shortcuts.append(viewOnline);
            }
          } else {
            shortcuts.append(document.createElement("span"));
          }
          row.append(name, meta, shortcuts);
          $("files").append(row);
        });
      }

      async function load() {
        setStatus("Loading repository files…");
        try {
          const response = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });
          if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
          const data = await response.json();
          if (data.truncated) setStatus("The GitHub tree is too large to list completely.", true);
          state.entries = (data.tree || [])
            .filter((entry) => (entry.type === "blob" || entry.type === "tree") && isPublicEntry(entry));
          state.path = rootPath;
          render();
          setStatus(`${state.entries.filter((entry) => entry.type === "blob").length} files indexed`);
        } catch (error) {
          setStatus(`Could not load repository files: ${error.message}`, true);
          $("files").textContent = "Try refreshing or browse the repository on GitHub.";
        }
      }

      $("search").oninput = (event) => { state.query = event.target.value; render(); };
      $("type").onchange = (event) => { state.type = event.target.value; render(); };
      $("refresh").onclick = load;
      $("close-copy-modal").onclick = () => $("copy-modal").close();
      $("copy-modal").onclick = (event) => {
        if (event.target === $("copy-modal")) $("copy-modal").close();
      };
      if (new URLSearchParams(window.location.search).get("embed") === "1") document.body.classList.add("embed-mode");
      load();
    })();
  </script>
</body>
</html>
